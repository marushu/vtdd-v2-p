openapi: 3.1.1
info:
  title: VTDD Butler Action API
  version: 0.1.0
  description: Canonical OpenAPI template for a user-owned VTDD Butler surface.
servers:
  - url: https://your-runtime-host.example.workers.dev
security:
  - GatewayBearerAuth: []
components:
  securitySchemes:
    GatewayBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
        mode:
          type: string
        autonomyMode:
          type: string
      additionalProperties: true
    VtddGenericResponse:
      type: object
      properties:
        ok:
          type: boolean
      additionalProperties: true
    VtddMemorySuspectedLine:
      type: object
      required:
        - file
      properties:
        file:
          type: string
        line:
          type: integer
          minimum: 1
        lineStart:
          type: integer
          minimum: 1
        lineEnd:
          type: integer
          minimum: 1
        reason:
          type: string
      additionalProperties: false
    OperationalMemoryResponse:
      type: object
      required:
        - ok
        - architecture
        - memoryUseRule
        - compactContext
        - referencesByLayer
        - retrievalSignals
      properties:
        ok:
          type: boolean
        architecture:
          type: object
          properties:
            purpose:
              type: string
            nonGoals:
              type: array
              items:
                type: string
            storageCandidates:
              type: array
              items:
                type: string
            layers:
              type: array
              items:
                type: object
                additionalProperties: true
            retrievalSignals:
              type: array
              items:
                type: string
            runtimeTruthRule:
              type: string
          additionalProperties: true
        queryText:
          type:
            - string
            - "null"
        repository:
          type:
            - string
            - "null"
        runtimeTruth:
          type:
            - object
            - "null"
          properties:
            currentState:
              type:
                - string
                - "null"
            source:
              type:
                - string
                - "null"
            checkedAt:
              type:
                - string
                - "null"
            overridesMemory:
              type: boolean
          additionalProperties: true
        memoryUseRule:
          type: string
          enum:
            - runtime_truth_current_state_overrides_memory_background_reference
            - memory_background_reference_only
        compactContext:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              layer:
                type: string
              type:
                type: string
              title:
                type: string
              summary:
                type:
                  - string
                  - "null"
              repository:
                type:
                  - string
                  - "null"
              crossRepository:
                type: boolean
              createdAt:
                type:
                  - string
                  - "null"
              tags:
                type: array
                items:
                  type: string
              score:
                type: integer
              scoreSignals:
                type: object
                properties:
                  relevance:
                    type: integer
                  governanceImportance:
                    type: integer
                  recurrence:
                    type: integer
                  recency:
                    type: integer
                additionalProperties: true
              use:
                type: string
            additionalProperties: true
        referencesByLayer:
          type: object
          properties:
            immediate_context:
              type: array
              items:
                type: object
                additionalProperties: true
            active_operational_memory:
              type: array
              items:
                type: object
                additionalProperties: true
            long_term_operational_memory:
              type: array
              items:
                type: object
                additionalProperties: true
            semantic_operational_patterns:
              type: array
              items:
                type: object
                additionalProperties: true
          additionalProperties: true
        retrievalSignals:
          type: object
          properties:
            rankedBy:
              type: array
              items:
                type: string
            limit:
              type: integer
            dumpedAllMemory:
              type: boolean
          additionalProperties: true
      additionalProperties: true
    VtddGatewayRequest:
      type: object
      properties:
        phase:
          type: string
          enum:
            - exploration
            - execution
        actorRole:
          type: string
          enum:
            - butler
            - executor
            - reviewer
        conversation:
          type: object
          properties:
            userText:
              type: string
            currentRepository:
              type: string
          additionalProperties: true
        surfaceContext:
          type: object
          properties:
            surface:
              type: string
            judgmentModelId:
              type: string
              enum:
                - vtdd-butler-core-v1
          additionalProperties: true
        judgmentTrace:
          type: array
          items:
            type: object
            properties:
              step:
                type: string
              status:
                type: string
              rationale:
                type: string
            additionalProperties: true
        policyInput:
          type: object
          properties:
            actionType:
              type: string
              enum:
                - read
                - summarize
                - issue_create
                - pr_comment
                - pr_review_submit
                - pr_operation
                - merge
                - deploy_production
                - destructive
                - external_publish
            mode:
              type: string
              enum:
                - read_only
                - execution
            repositoryInput:
              type: string
            targetConfirmed:
              type: boolean
            issueTraceable:
              type: boolean
            issueTraceability:
              type: object
              properties:
                relatedIssue:
                  type: integer
                intentRefs:
                  type: array
                  items:
                    type: string
                successCriteriaRefs:
                  type: array
                  items:
                    type: string
                nonGoalRefs:
                  type: array
                  items:
                    type: string
              additionalProperties: true
            go:
              type: boolean
            passkey:
              type: boolean
            runtimeTruth:
              type: object
              properties:
                runtimeAvailable:
                  type: boolean
                safeFallbackChosen:
                  type: boolean
              additionalProperties: true
            consent:
              type: object
              properties:
                grantedCategories:
                  type: array
                  items:
                    type: string
              additionalProperties: true
          additionalProperties: true
        continuationContext:
          type: object
          properties:
            executionId:
              type: string
            requiresHandoff:
              type: boolean
            codexGoal:
              type: string
              enum:
                - open_pr
                - revise_pr
                - respond_to_review
                - post_merge_verify
            executorTransport:
              type: string
              enum:
                - codex_cloud_github_comment
                - codex_cloud_cli_control_runner
                - vps_runner
                - api_key_runner
            apiKeyRunnerAcknowledged:
              type: boolean
            handoff:
              type: object
              required:
                - issueTraceable
                - approvalScopeMatched
                - relatedIssue
                - summary
              properties:
                issueTraceable:
                  type: boolean
                approvalScopeMatched:
                  type: boolean
                relatedIssue:
                  type: integer
                summary:
                  type: string
              additionalProperties: true
          additionalProperties: true
        memoryRecord:
          type: object
          properties:
            type:
              type: string
          additionalProperties: true
      additionalProperties: true
    VtddExecuteRequest:
      type: object
      properties:
        phase:
          type: string
          enum:
            - execution
        actorRole:
          type: string
          enum:
            - butler
        surfaceContext:
          type: object
          properties:
            surface:
              type: string
            judgmentModelId:
              type: string
              enum:
                - vtdd-butler-core-v1
          additionalProperties: true
        judgmentTrace:
          type: array
          items:
            type: object
            properties:
              step:
                type: string
              status:
                type: string
              rationale:
                type: string
            additionalProperties: true
        policyInput:
          type: object
          properties:
            actionType:
              type: string
              enum:
                - read
                - summarize
                - issue_create
                - build
                - pr_comment
                - pr_review_submit
                - pr_operation
                - merge
                - deploy_production
                - destructive
                - external_publish
            mode:
              type: string
              enum:
                - read_only
                - execution
            repositoryInput:
              type: string
            targetConfirmed:
              type: boolean
            issueTraceable:
              type: boolean
            issueTraceability:
              type: object
              properties:
                relatedIssue:
                  type: integer
                intentRefs:
                  type: array
                  items:
                    type: string
                successCriteriaRefs:
                  type: array
                  items:
                    type: string
                nonGoalRefs:
                  type: array
                  items:
                    type: string
              additionalProperties: true
            go:
              type: boolean
            passkey:
              type: boolean
            runtimeTruth:
              type: object
              properties:
                runtimeAvailable:
                  type: boolean
                safeFallbackChosen:
                  type: boolean
              additionalProperties: true
            consent:
              type: object
              properties:
                grantedCategories:
                  type: array
                  items:
                    type: string
              additionalProperties: true
          additionalProperties: true
        continuationContext:
          type: object
          properties:
            executionId:
              type: string
            requiresHandoff:
              type: boolean
            codexGoal:
              type: string
              enum:
                - open_pr
                - revise_pr
                - respond_to_review
                - post_merge_verify
            executorTransport:
              type: string
              enum:
                - codex_cloud_github_comment
                - codex_cloud_cli_control_runner
                - vps_runner
                - api_key_runner
            apiKeyRunnerAcknowledged:
              type: boolean
            handoff:
              type: object
              required:
                - issueTraceable
                - approvalScopeMatched
                - relatedIssue
                - summary
              properties:
                issueTraceable:
                  type: boolean
                approvalScopeMatched:
                  type: boolean
                relatedIssue:
                  type: integer
                summary:
                  type: string
              additionalProperties: true
          additionalProperties: true
        issueContext:
          type: object
          properties:
            issueNumber:
              type: integer
            issueTitle:
              type: string
            issueUrl:
              type: string
          additionalProperties: true
        executorTransport:
          type: string
          enum:
            - codex_cloud_github_comment
            - codex_cloud_cli_control_runner
            - vps_runner
            - api_key_runner
        apiKeyRunnerAcknowledged:
          type: boolean
      additionalProperties: true
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Check whether the VTDD worker is reachable.
      responses:
        "200":
          description: Worker health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v2/gateway:
    post:
      operationId: vtddGateway
      summary: Evaluate VTDD policy, repository candidates, and Butler guidance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VtddGatewayRequest"
      responses:
        "200":
          description: Gateway evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "401":
          description: Missing machine auth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "403":
          description: Invalid machine auth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "422":
          description: Request blocked by policy or validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/action/execute:
    post:
      operationId: vtddExecute
      summary: Dispatch bounded VTDD execution, including remote Codex handoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VtddExecuteRequest"
      responses:
        "202":
          description: Execution queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "401":
          description: Missing machine auth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "403":
          description: Invalid machine auth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "422":
          description: Execution request blocked or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "503":
          description: Execution dispatch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/action/github:
    post:
      operationId: vtddWriteGitHub
      summary: Execute scoped normal-tier GitHub write operations through VTDD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  enum:
                    - issue_create
                    - issue_comment_create
                    - issue_comment_update
                    - branch_create
                    - pull_create
                    - pull_update
                    - pull_comment_create
                repository:
                  type: string
                issueNumber:
                  type: integer
                pullNumber:
                  type: integer
                commentId:
                  type: integer
                branch:
                  type: string
                baseRef:
                  type: string
                head:
                  type: string
                title:
                  type: string
                body:
                  type: string
                responseMode:
                  type: string
                  enum:
                    - action_visible
                  description: Use action_visible from Custom GPT so write failures return ok:false JSON instead of an Action transport failure.
                naturalApproval:
                  type: object
                  description: Evidence for normal GitHub write natural GO binding after Butler showed the exact payload and the user replied with GO. Supported natural GO operations include issue_create, issue_comment_create, and pull_comment_create.
                  properties:
                    exactPayloadPresented:
                      type: boolean
                    repositoryResolved:
                      type: boolean
                    userText:
                      type: string
                    presentedPayload:
                      type: object
                      properties:
                        operation:
                          type: string
                          enum:
                            - issue_create
                            - issue_comment_create
                            - pull_comment_create
                        repository:
                          type: string
                        issueNumber:
                          type: integer
                        pullNumber:
                          type: integer
                        title:
                          type: string
                        body:
                          type: string
                      additionalProperties: true
                  additionalProperties: true
                issueContext:
                  type: object
                  properties:
                    issueNumber:
                      type: integer
                  additionalProperties: true
                policyInput:
                  type: object
                  properties:
                    approvalPhrase:
                      type: string
                    targetConfirmed:
                      type: boolean
                    approvalScopeMatched:
                      type: boolean
                  additionalProperties: true
              additionalProperties: true
      responses:
        "200":
          description: GitHub normal write executed, or an action-visible ok:false envelope when responseMode is action_visible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "401":
          description: Missing machine auth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "403":
          description: Invalid machine auth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "422":
          description: GitHub write request blocked or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "503":
          description: GitHub write route unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/action/memory-write:
    post:
      operationId: vtddWriteOperationalMemory
      summary: Persist a structured VTDD operational memory candidate after Butler shows it and receives GO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recordType
                - confirmed
              properties:
                recordType:
                  type: string
                  enum:
                    - decision_log
                    - proposal_log
                    - working_memory
                    - repair_case
                confirmed:
                  type: boolean
                  description: True only after Butler shows the structured memory candidate and the human replies GO.
                ownerConsent:
                  type: string
                  description: Optional natural GO evidence. Do not ask the human for raw JSON.
                repository:
                  type: string
                relatedIssue:
                  type: integer
                summary:
                  type: string
                details:
                  type: string
                checkpointReason:
                  type: string
                  description: Why this RAG checkpoint is being saved, such as context compression risk, owner leaving, dry-run hypothesis, or error observation.
                thoughtLocation:
                  type: string
                  description: Human-readable place where the thought emerged, without requiring raw transcript capture.
                userTension:
                  type: string
                  description: The owner's tension or mood relevant to future recall, expressed compactly.
                origin:
                  type: object
                  description: Structured recall provenance for where the memory candidate arose.
                  properties:
                    surface:
                      type: string
                      maxLength: 80
                    moment:
                      type: string
                      maxLength: 160
                    trigger:
                      type: string
                      maxLength: 240
                  additionalProperties: false
                user_words:
                  type: array
                  description: A few short owner utterances that help future recall; not a transcript.
                  maxItems: 3
                  items:
                    type: string
                    maxLength: 160
                tension_note:
                  type: object
                  description: Recall hook for the moment's temperature; not a personality evaluation.
                  properties:
                    summary:
                      type: string
                      maxLength: 240
                    intensity:
                      type: string
                      maxLength: 40
                    mode:
                      type: string
                      maxLength: 40
                    why_it_matters:
                      type: string
                      maxLength: 320
                  additionalProperties: false
                contextSourceQuality:
                  type: string
                  enum:
                    - full_thread_context
                    - compressed_context
                    - external_evidence
                    - missing_context_risk
                  description: Whether the checkpoint came from full active context, compressed context, external evidence, or known context-loss risk.
                captureBoundary:
                  type: string
                  description: Must describe a judgment log or operational summary, not hidden chain-of-thought or full transcript capture.
                decision:
                  type: string
                rationale:
                  type: string
                decidedBy:
                  type: string
                supersededBy:
                  type: string
                hypothesis:
                  type: string
                explorationHypothesis:
                  type: object
                  description: Structured exploration hypothesis for meaningful checkpoints; use for suspected files/lines and whether the hypothesis is open, confirmed, rejected, superseded, or unknown.
                  properties:
                    summary:
                      type: string
                    whySuspected:
                      type: string
                    status:
                      type: string
                      enum:
                        - open
                        - confirmed
                        - rejected
                        - superseded
                        - unknown
                    suspectedFiles:
                      type: array
                      items:
                        type: string
                    suspectedLines:
                      type: array
                      items:
                        $ref: "#/components/schemas/VtddMemorySuspectedLine"
                    actualRootCause:
                      type: string
                  additionalProperties: false
                suspectedFiles:
                  type: array
                  items:
                    type: string
                suspectedLines:
                  type: array
                  items:
                    $ref: "#/components/schemas/VtddMemorySuspectedLine"
                rejectedHypotheses:
                  type: array
                  description: Hypotheses that looked plausible but were later rejected; store them to prevent repeated exploration drift.
                  items:
                    type: object
                    properties:
                      summary:
                        type: string
                      whyRejected:
                        type: string
                      evidence:
                        type: string
                    additionalProperties: false
                stopReason:
                  type: object
                  description: Structured reason the actor stopped instead of continuing.
                  additionalProperties: true
                uncertainty:
                  type: object
                  description: Structured uncertainty that future actors must resolve before claiming completion.
                  additionalProperties: true
                failureReasoning:
                  type: object
                  description: Failure reasoning for unresolved or exploratory memory; use repair_case only after root cause and repair are known.
                  additionalProperties: true
                successPattern:
                  type: object
                  description: Reusable success pattern with reuse conditions and hidden constraints.
                  additionalProperties: true
                handoffMemory:
                  type: object
                  description: Reconstruction hints and hidden risks for the next actor.
                  additionalProperties: true
                options:
                  type: array
                  items:
                    type: string
                concerns:
                  type: array
                  items:
                    type: string
                unresolvedQuestions:
                  type: array
                  items:
                    type: string
                proposedBy:
                  type: string
                rejectedReasons:
                  type: array
                  items:
                    type: object
                    properties:
                      option:
                        type: string
                      reason:
                        type: string
                    additionalProperties: false
                tags:
                  type: array
                  items:
                    type: string
                expectedFiles:
                  type: array
                  items:
                    type: string
                evidenceLinks:
                  type: array
                  items:
                    type: string
                previousRecordIds:
                  type: array
                  items:
                    type: string
                priority:
                  type: integer
                timestamp:
                  type: string
                responseMode:
                  type: string
                  enum:
                    - action_visible
                  description: Use action_visible from Custom GPT so memory write failures return ok:false JSON instead of an Action transport failure.
              additionalProperties: false
      responses:
        "200":
          description: Memory write persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "401":
          description: Missing machine auth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "403":
          description: Invalid machine auth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "422":
          description: Memory write blocked or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "503":
          description: Memory provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/action/github-authority:
    post:
      operationId: vtddGitHubAuthority
      summary: Execute approval-bound GitHub authority actions that require scoped passkey approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  enum:
                    - pull_ready_for_review
                    - pull_merge
                    - issue_close
                repository:
                  type: string
                issueNumber:
                  type: integer
                pullNumber:
                  type: integer
                mergeMethod:
                  type: string
                  enum:
                    - merge
                    - squash
                    - rebase
                commitTitle:
                  type: string
                commitMessage:
                  type: string
                issueContext:
                  type: object
                  properties:
                    issueNumber:
                      type: integer
                  additionalProperties: true
                policyInput:
                  type: object
                  properties:
                    approvalPhrase:
                      type: string
                    approvalGrantId:
                      type: string
                    targetConfirmed:
                      type: boolean
                  additionalProperties: true
              additionalProperties: true
      responses:
        "200":
          description: GitHub authority action executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "401":
          description: Missing machine auth
        "403":
          description: Invalid machine auth
        "422":
          description: GitHub authority action blocked or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "503":
          description: GitHub authority route unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/action/deploy:
    post:
      operationId: vtddDeployProduction
      summary: Dispatch governed production deploy after scoped passkey approval approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repository:
                  type: string
                runtimeUrl:
                  type: string
                phase:
                  type: string
                policyInput:
                  type: object
                  properties:
                    approvalPhrase:
                      type: string
                    approvalGrantId:
                      type: string
                  additionalProperties: true
              additionalProperties: true
      responses:
        "202":
          description: Production deploy dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "401":
          description: Missing machine auth
        "403":
          description: Invalid machine auth
        "422":
          description: Deploy request blocked or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "503":
          description: Deploy dispatch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/action/github-actions-secret:
    post:
      operationId: vtddSyncGitHubActionsSecret
      summary: Sync an approved GitHub Actions secret such as OPENAI_API_KEY or VTDD_GATEWAY_BEARER_TOKEN after scoped passkey approval approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repository:
                  type: string
                secretName:
                  type: string
                  enum:
                    - OPENAI_API_KEY
                    - VTDD_GATEWAY_BEARER_TOKEN
                secretValue:
                  type: string
                policyInput:
                  type: object
                  properties:
                    approvalGrantId:
                      type: string
                  additionalProperties: true
              additionalProperties: true
      responses:
        "200":
          description: GitHub Actions secret synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        "401":
          description: Missing machine auth
        "403":
