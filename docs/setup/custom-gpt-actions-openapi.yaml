openapi: 3.1.1
info:
  title: "VTDD Butler Action API"
  version: 0.2.0
  description: "GPT-facing facade schema for a user-owned VTDD Butler surface. Internal runtime capabilities stay behind category endpoints so Custom GPT remains under the 30 operation limit."
servers:
  - url: https://your-runtime-host.example.workers.dev
security:
  - GatewayBearerAuth: []
components:
  securitySchemes:
    GatewayBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "API token"
  schemas:
    VtddGenericResponse:
      type: object
      properties:
        ok:
          type: boolean
      additionalProperties: true
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
        mode:
          type: string
        autonomyMode:
          type: string
      additionalProperties: true
    VtddCustomGptGatewayRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - evaluate
        phase:
          type: string
          enum:
            - exploration
            - execution
        actorRole:
          type: string
        conversation:
          type: object
          additionalProperties: true
        surfaceContext:
          type: object
          additionalProperties: true
        judgmentTrace:
          type: array
          items:
            type: object
            additionalProperties: true
        policyInput:
          type: object
          additionalProperties: true
          properties:
            issueTraceability:
              type: object
              properties:
                relatedIssue:
                  type: integer
                intentRefs:
                  type: array
                  items:
                    type: string
                successCriteriaRefs:
                  type: array
                  items:
                    type: string
                nonGoalRefs:
                  type: array
                  items:
                    type: string
              additionalProperties: true
            targetConfirmed:
              type: boolean
            approvalScopeMatched:
              type: boolean
            actionType:
              type: string
        continuationContext:
          type: object
          additionalProperties: true
          properties:
            requiresHandoff:
              type: boolean
            executionId:
              type: string
            handoff:
              type: object
              properties:
                relatedIssue:
                  type: integer
                issueTraceable:
                  type: boolean
                approvalScopeMatched:
                  type: boolean
                summary:
                  type: string
              additionalProperties: true
        memoryRecord:
          type: object
          additionalProperties: true
      additionalProperties: true
    VtddCustomGptMemoryRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - retrieve_operational_memory
            - write
            - retrieve_cross_memory
            - retrieve_constitution
            - retrieve_decisions
            - retrieve_proposals
            - retrieve_codex_usage
            - codex_usage_snapshot
        text:
          type: string
        repository:
          type: string
        recordId:
          type: string
        relatedIssue:
          type: integer
        issueNumber:
          type: integer
        limit:
          type: integer
        semantic:
          type: boolean
        recordType:
          type: string
          enum:
            - decision_log
            - proposal_log
            - working_memory
            - repair_case
        confirmed:
          type: boolean
        summary:
          type: string
        details:
          type: string
        tags:
          type: array
          items:
            type: string
        responseMode:
          type: string
          enum:
            - action_visible
      additionalProperties: true
    VtddCustomGptGitHubRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - read
            - write
            - nickname_list
            - nickname_upsert
            - nickname_delete
        resource:
          type: string
          enum:
            - repositories
            - issues
            - issue_comments
            - pulls
            - pull_reviews
            - pull_review_comments
            - checks
            - workflow_runs
            - workflow_jobs
            - branches
            - contents
            - tree
        operation:
          type: string
          enum:
            - issue_create
            - issue_comment_create
            - issue_comment_update
            - branch_create
            - pull_create
            - pull_update
            - pull_comment_create
        repository:
          type: string
        issueNumber:
          type: integer
        pullNumber:
          type: integer
        branch:
          type: string
        ref:
          type: string
        path:
          type: string
        state:
          type: string
        limit:
          type: integer
        title:
          type: string
        body:
          type: string
        nickname:
          type: string
        nicknames:
          type: array
          items:
            type: string
        mode:
          type: string
          enum:
            - append
            - replace
        naturalApproval:
          type: object
          additionalProperties: true
        policyInput:
          type: object
          additionalProperties: true
        responseMode:
          type: string
          enum:
            - action_visible
      additionalProperties: true
    VtddCustomGptSetupRequest:
      type: object
      required:
        - action
        - repository
      properties:
        action:
          type: string
          enum:
            - self_parity
            - diagnostics
            - setup_artifact
            - cloudflare_pages
        repository:
          type: string
        ref:
          type: string
        issueNumber:
          type: integer
        pullNumber:
          type: integer
        artifact:
          type: string
          enum:
            - instructions
            - openapi_yaml
            - openapi_json
        actionName:
          type: string
        httpStatus:
          type: integer
        error:
          type: string
        reason:
          type: string
        responseMode:
          type: string
          enum:
            - action_visible
      additionalProperties: true
    VtddCustomGptExecutionRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - execute
            - progress
            - vps_runner_status
            - vps_runner_cancel
        phase:
          type: string
          enum:
            - execution
        actorRole:
          type: string
        repository:
          type: string
        issueNumber:
          type: integer
        executionId:
          type: string
        branch:
          type: string
        executorTransport:
          type: string
          enum:
            - codex_cloud_github_comment
            - codex_cloud_cli_control_runner
            - vps_runner
            - api_key_runner
        conversation:
          type: object
          additionalProperties: true
        surfaceContext:
          type: object
          additionalProperties: true
        judgmentTrace:
          type: array
          items:
            type: object
            additionalProperties: true
        policyInput:
          type: object
          additionalProperties: true
          properties:
            issueTraceability:
              type: object
              properties:
                relatedIssue:
                  type: integer
                intentRefs:
                  type: array
                  items:
                    type: string
                successCriteriaRefs:
                  type: array
                  items:
                    type: string
                nonGoalRefs:
                  type: array
                  items:
                    type: string
              additionalProperties: true
            targetConfirmed:
              type: boolean
            approvalScopeMatched:
              type: boolean
            actionType:
              type: string
        continuationContext:
          type: object
          additionalProperties: true
          properties:
            requiresHandoff:
              type: boolean
            executionId:
              type: string
            handoff:
              type: object
              properties:
                relatedIssue:
                  type: integer
                issueTraceable:
                  type: boolean
                approvalScopeMatched:
                  type: boolean
                summary:
                  type: string
              additionalProperties: true
        issueContext:
          type: object
          additionalProperties: true
        mode:
          type: string
          enum:
            - execution
            - issue_pending
            - drain_pending
        reason:
          type: string
        actor:
          type: string
      additionalProperties: true
    VtddCustomGptOpsRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - deploy_request
            - github_authority_request
            - secret_sync_request
            - variable_sync_request
            - vps_maintenance_request
            - issue_close_request
        repository:
          type: string
        repositoryInput:
          type: string
        issueNumber:
          type: integer
        relatedIssue:
          type: integer
        pullNumber:
          type: integer
        phase:
          type: string
        operation:
          type: string
          enum:
            - pull_ready_for_review
            - pull_merge
            - issue_close
      additionalProperties: true
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: "Check whether the VTDD worker is reachable."
      responses:
        200:
          description: "Worker health response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v2/custom-gpt/gateway:
    post:
      operationId: vtddCustomGptGateway
      summary: "Evaluate VTDD policy and Butler guidance through the Custom GPT gateway facade."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VtddCustomGptGatewayRequest"
      responses:
        200:
          description: "VTDD facade response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        202:
          description: "VTDD facade accepted response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        401:
          description: "Missing machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        403:
          description: "Invalid machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        422:
          description: "Request blocked or invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        503:
          description: "Runtime provider unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/custom-gpt/memory:
    post:
      operationId: vtddCustomGptMemory
      summary: "Retrieve or persist VTDD memory through a categorized Custom GPT facade."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VtddCustomGptMemoryRequest"
      responses:
        200:
          description: "VTDD facade response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        202:
          description: "VTDD facade accepted response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        401:
          description: "Missing machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        403:
          description: "Invalid machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        422:
          description: "Request blocked or invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        503:
          description: "Runtime provider unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/custom-gpt/github:
    post:
      operationId: vtddCustomGptGitHub
      summary: "Read or perform scoped normal GitHub operations through a categorized Custom GPT facade."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VtddCustomGptGitHubRequest"
      responses:
        200:
          description: "VTDD facade response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        202:
          description: "VTDD facade accepted response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        401:
          description: "Missing machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        403:
          description: "Invalid machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        422:
          description: "Request blocked or invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        503:
          description: "Runtime provider unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/custom-gpt/setup:
    post:
      operationId: vtddCustomGptSetup
      summary: "Read setup artifacts, diagnostics, and self-parity through a Custom GPT facade."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VtddCustomGptSetupRequest"
      responses:
        200:
          description: "VTDD facade response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        202:
          description: "VTDD facade accepted response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        401:
          description: "Missing machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        403:
          description: "Invalid machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        422:
          description: "Request blocked or invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        503:
          description: "Runtime provider unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/custom-gpt/execution:
    post:
      operationId: vtddCustomGptExecution
      summary: "Request bounded execution or read execution progress through a Custom GPT facade."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VtddCustomGptExecutionRequest"
      responses:
        200:
          description: "VTDD facade response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        202:
          description: "VTDD facade accepted response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        401:
          description: "Missing machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        403:
          description: "Invalid machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        422:
          description: "Request blocked or invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        503:
          description: "Runtime provider unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
  /v2/custom-gpt/ops:
    post:
      operationId: vtddCustomGptOps
      summary: "Prepare high-risk operation handoff links without directly executing deploy, secret, or VPS maintenance work."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VtddCustomGptOpsRequest"
      responses:
        200:
          description: "VTDD facade response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        202:
          description: "VTDD facade accepted response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        401:
          description: "Missing machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        403:
          description: "Invalid machine auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        422:
          description: "Request blocked or invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
        503:
          description: "Runtime provider unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VtddGenericResponse"
