name: guarded-autonomy-required-checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: read

jobs:
  guarded-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current PR body
        id: pr-body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_body_file="$RUNNER_TEMP/current-pr-body.md"
          gh api "repos/${REPOSITORY}/pulls/${PULL_NUMBER}" --jq '.body // ""' > "$pr_body_file"
          printf 'path=%s\n' "$pr_body_file" >> "$GITHUB_OUTPUT"

      - name: Reject draft pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          draft="$(gh api "repos/${REPOSITORY}/pulls/${PULL_NUMBER}" --jq '.draft')"
          if [ "$draft" = "true" ]; then
            echo "Draft PRs are disabled for VTDD implementation flow. Use a ready PR plus explicit blocked/incomplete evidence instead."
            exit 1
          fi

      - name: Validate PR evidence sections
        shell: bash
        env:
          PR_BODY_FILE: ${{ steps.pr-body.outputs.path }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$(cat "$PR_BODY_FILE")"
          queue_delta_enforced_from_pr=596
          required_markers=(
            "## This PR satisfies Intent"
            "## Satisfied Success Criteria"
            "## Unsatisfied Success Criteria"
            "## Verification Evidence"
            "## Butler Completion Contract"
            "## Surface Update Checklist"
            "## Execution Queue Delta"
          )

          for marker in "${required_markers[@]}"; do
            if [ "$marker" = "## Execution Queue Delta" ] && [ "$PULL_NUMBER" -lt "$queue_delta_enforced_from_pr" ]; then
              echo "Skipping Execution Queue Delta marker for grandfathered PR #$PULL_NUMBER."
              continue
            fi
            if ! printf '%s' "$body" | grep -F "$marker" >/dev/null; then
              echo "Missing PR template marker: $marker"
              exit 1
            fi
          done

      - name: Validate execution queue delta
        shell: bash
        env:
          PR_BODY_FILE: ${{ steps.pr-body.outputs.path }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          queue_delta_enforced_from_pr=596
          if [ "$PULL_NUMBER" -lt "$queue_delta_enforced_from_pr" ]; then
            echo "Skipping Execution Queue Delta enforcement for grandfathered PR #$PULL_NUMBER."
            exit 0
          fi

          body="$(cat "$PR_BODY_FILE")"
          queue_delta="$(printf '%s' "$body" | awk '/^## Execution Queue Delta/{flag=1; next} /^## /{flag=0} flag')"
          required_fields=(
            "Queue position before"
            "Preemption decision"
            "Queue delta"
            "Why this PR is next"
            "Active Issues not downscoped"
          )

          for field in "${required_fields[@]}"; do
            line="$(printf '%s\n' "$queue_delta" | grep -E "^- ${field}: .+" || true)"
            if [ -z "$line" ]; then
              echo "Missing or empty Execution Queue Delta field: $field"
              exit 1
            fi
            value="${line#- ${field}: }"
            value="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//')"
            case "$value" in
              ""|"none"|"none."|"not required"|"not required."|"not provided"|"not provided."|"todo"|"tbd")
                echo "Execution Queue Delta field is not filled: $field"
                exit 1
                ;;
            esac
          done

          preemption_line="$(printf '%s\n' "$queue_delta" | grep -E "^- Preemption decision: .+")"
          preemption_value="${preemption_line#- Preemption decision: }"
          if ! printf '%s' "$preemption_value" | grep -Eq '\b(EMERGENCY|ROOT|NEXT|QUEUE|EVIDENCE|QUESTION)\b'; then
            echo "Execution Queue Delta Preemption decision must name one queue classification: EMERGENCY, ROOT, NEXT, QUEUE, EVIDENCE, or QUESTION."
            exit 1
          fi

          queue_delta_line="$(printf '%s\n' "$queue_delta" | grep -E "^- Queue delta: .+")"
          queue_delta_value="${queue_delta_line#- Queue delta: }"
          if ! printf '%s' "$queue_delta_value" | grep -Eq '(Issue #[0-9]+|PR #[0-9]+|`Now`|`Next`|Root Blockers|Evidence Gaps|Blocked|Queue)'; then
            echo "Execution Queue Delta Queue delta must name the Issue/PR or queue bucket being moved."
            exit 1
          fi

          active_line="$(printf '%s\n' "$queue_delta" | grep -E "^- Active Issues not downscoped: .+")"
          active_value="${active_line#- Active Issues not downscoped: }"
          if ! printf '%s' "$active_value" | grep -Eiq '(縮小しない|縮小しません|not downscop|not shrink|remain active|active issues are not)'; then
            echo "Execution Queue Delta must explicitly state that active Issues are not downscoped."
            exit 1
          fi

      - name: Validate Butler completion contract
        shell: bash
        env:
          PR_BODY_FILE: ${{ steps.pr-body.outputs.path }}
        run: |
          body="$(cat "$PR_BODY_FILE")"
          contract="$(printf '%s' "$body" | awk '/^## Butler Completion Contract/{flag=1; next} /^## /{flag=0} flag')"
          required_fields=(
            "Owner goal"
            "Butler entrypoint"
            "Action Schema exposure"
            "Runtime path"
            "Runner/runtime truth"
            "Authority boundary"
            "E2E evidence"
            "Completion status"
          )

          for field in "${required_fields[@]}"; do
            line="$(printf '%s\n' "$contract" | grep -E "^- ${field}: .+" || true)"
            if [ -z "$line" ]; then
              echo "Missing or empty Butler Completion Contract field: $field"
              exit 1
            fi
            value="${line#- ${field}: }"
            value="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//')"
            case "$value" in
              ""|"none"|"none."|"not required"|"not required."|"not provided"|"not provided."|"todo"|"tbd")
                echo "Butler Completion Contract field is not filled: $field"
                exit 1
                ;;
            esac
          done

          status_line="$(printf '%s\n' "$contract" | grep -E "^- Completion status: .+")"
          status="${status_line#- Completion status: }"
          status="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//')"
          case "$status" in
            complete|incomplete|unconnected) ;;
            *)
              echo "Butler Completion Contract status must be complete, incomplete, or unconnected."
              exit 1
              ;;
          esac

          if printf '%s' "$body" | awk '/^## Unsatisfied Success Criteria/{flag=1; next} /^## /{flag=0} flag' | grep -Eiq '^[[:space:]]*(- )?none\.?[[:space:]]*$' && [ "$status" != "complete" ]; then
            echo "PR claims no unsatisfied Success Criteria but Butler Completion Contract is not complete."
            exit 1
          fi

          if [ "$status" = "complete" ]; then
            e2e_line="$(printf '%s\n' "$contract" | grep -E "^- E2E evidence: .+")"
            e2e_value="${e2e_line#- E2E evidence: }"
            e2e_value="$(printf '%s' "$e2e_value" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//')"
            case "$e2e_value" in
              ""|"none"|"none."|"not required"|"not required."|"not provided"|"not provided."|"todo"|"tbd")
                echo "Butler Completion Contract status is complete but Butler-facing E2E evidence is missing."
                exit 1
                ;;
            esac
          fi

      - name: Guard Closes usage with E2E evidence pointers
        shell: bash
        env:
          PR_BODY_FILE: ${{ steps.pr-body.outputs.path }}
        run: |
          body="$(cat "$PR_BODY_FILE")"
          if printf '%s' "$body" | grep -Eiq 'Closes #[0-9]+'; then
            if ! printf '%s' "$body" | grep -Eq 'E2E:'; then
              echo "PR uses Closes but E2E slot is missing."
              exit 1
            fi
            if ! printf '%s' "$body" | grep -Eq 'Evidence path/link:'; then
              echo "PR uses Closes but evidence path/link slot is missing."
              exit 1
            fi
            contract="$(printf '%s' "$body" | awk '/^## Butler Completion Contract/{flag=1; next} /^## /{flag=0} flag')"
            status_line="$(printf '%s\n' "$contract" | grep -E "^- Completion status: .+")"
            status="${status_line#- Completion status: }"
            status="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//')"
            if [ "$status" != "complete" ]; then
              echo "PR uses Closes but Butler Completion Contract status is not complete."
              exit 1
            fi
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
