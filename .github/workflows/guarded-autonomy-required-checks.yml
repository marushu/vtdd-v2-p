name: guarded-autonomy-required-checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  guarded-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current PR body
        id: pr-body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_body_file="$RUNNER_TEMP/current-pr-body.md"
          gh api "repos/${REPOSITORY}/pulls/${PULL_NUMBER}" --jq '.body // ""' > "$pr_body_file"
          printf 'path=%s\n' "$pr_body_file" >> "$GITHUB_OUTPUT"

      - name: Validate PR evidence sections
        shell: bash
        env:
          PR_BODY_FILE: ${{ steps.pr-body.outputs.path }}
        run: |
          body="$(cat "$PR_BODY_FILE")"
          required_markers=(
            "## This PR satisfies Intent"
            "## Satisfied Success Criteria"
            "## Unsatisfied Success Criteria"
            "## Verification Evidence"
            "## Butler Completion Contract"
            "## Surface Update Checklist"
          )

          for marker in "${required_markers[@]}"; do
            if ! printf '%s' "$body" | grep -F "$marker" >/dev/null; then
              echo "Missing PR template marker: $marker"
              exit 1
            fi
          done

      - name: Validate Butler completion contract
        shell: bash
        env:
          PR_BODY_FILE: ${{ steps.pr-body.outputs.path }}
        run: |
          body="$(cat "$PR_BODY_FILE")"
          contract="$(printf '%s' "$body" | awk '/^## Butler Completion Contract/{flag=1; next} /^## /{flag=0} flag')"
          required_fields=(
            "Owner goal"
            "Butler entrypoint"
            "Action Schema exposure"
            "Runtime path"
            "Runner/runtime truth"
            "Authority boundary"
            "E2E evidence"
            "Completion status"
          )

          for field in "${required_fields[@]}"; do
            line="$(printf '%s\n' "$contract" | grep -E "^- ${field}: .+" || true)"
            if [ -z "$line" ]; then
              echo "Missing or empty Butler Completion Contract field: $field"
              exit 1
            fi
            value="${line#- ${field}: }"
            value="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//')"
            case "$value" in
              ""|"none"|"none."|"not required"|"not required."|"not provided"|"not provided."|"todo"|"tbd")
                echo "Butler Completion Contract field is not filled: $field"
                exit 1
                ;;
            esac
          done

          status_line="$(printf '%s\n' "$contract" | grep -E "^- Completion status: .+")"
          status="${status_line#- Completion status: }"
          status="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//')"
          case "$status" in
            complete|incomplete|unconnected) ;;
            *)
              echo "Butler Completion Contract status must be complete, incomplete, or unconnected."
              exit 1
              ;;
          esac

          if printf '%s' "$body" | awk '/^## Unsatisfied Success Criteria/{flag=1; next} /^## /{flag=0} flag' | grep -Eiq '^[[:space:]]*(- )?none\.?[[:space:]]*$' && [ "$status" != "complete" ]; then
            echo "PR claims no unsatisfied Success Criteria but Butler Completion Contract is not complete."
            exit 1
          fi

          if [ "$status" = "complete" ]; then
            e2e_line="$(printf '%s\n' "$contract" | grep -E "^- E2E evidence: .+")"
            e2e_value="${e2e_line#- E2E evidence: }"
            e2e_value="$(printf '%s' "$e2e_value" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//')"
            case "$e2e_value" in
              ""|"none"|"none."|"not required"|"not required."|"not provided"|"not provided."|"todo"|"tbd")
                echo "Butler Completion Contract status is complete but Butler-facing E2E evidence is missing."
                exit 1
                ;;
            esac
          fi

      - name: Guard Closes usage with E2E evidence pointers
        shell: bash
        env:
          PR_BODY_FILE: ${{ steps.pr-body.outputs.path }}
        run: |
          body="$(cat "$PR_BODY_FILE")"
          if printf '%s' "$body" | grep -Eiq 'Closes #[0-9]+'; then
            if ! printf '%s' "$body" | grep -Eq 'E2E:'; then
              echo "PR uses Closes but E2E slot is missing."
              exit 1
            fi
            if ! printf '%s' "$body" | grep -Eq 'Evidence path/link:'; then
              echo "PR uses Closes but evidence path/link slot is missing."
              exit 1
            fi
            contract="$(printf '%s' "$body" | awk '/^## Butler Completion Contract/{flag=1; next} /^## /{flag=0} flag')"
            status_line="$(printf '%s\n' "$contract" | grep -E "^- Completion status: .+")"
            status="${status_line#- Completion status: }"
            status="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]]+$//')"
            if [ "$status" != "complete" ]; then
              echo "PR uses Closes but Butler Completion Contract status is not complete."
              exit 1
            fi
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
