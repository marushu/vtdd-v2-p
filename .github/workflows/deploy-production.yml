name: deploy-production

on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: "Deprecated compatibility input from pre-#430 operators. Ignored; scoped approval_grant_id is authoritative."
        required: false
        type: string
      runtime_url:
        description: "Worker runtime URL used to validate the real passkey approval grant"
        required: true
        type: string
      approval_grant_id:
        description: "Real WebAuthn/passkey approval grant id for deploy_production"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Enforce passkey approval boundary
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.runtime_url }}" ]; then
            echo "runtime_url is required for production deploy."
            exit 1
          fi
          if [ -z "${{ github.event.inputs.approval_grant_id }}" ]; then
            echo "approval_grant_id is required for production deploy."
            exit 1
          fi

      - name: Preflight deploy credentials
        env:
          VTDD_GATEWAY_BEARER_TOKEN: ${{ secrets.VTDD_GATEWAY_BEARER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        shell: bash
        run: |
          missing=0
          if [ -z "$VTDD_GATEWAY_BEARER_TOKEN" ]; then
            echo "Missing required Actions secret: VTDD_GATEWAY_BEARER_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required Actions secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required Actions secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "Missing required Actions secret: CLOUDFLARE_D1_DATABASE_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing secrets before requesting passkey approval for production deploy."
            exit 1
          fi

      - name: Preflight Cloudflare Workers deploy entitlement
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          response_file="$(mktemp)"
          http_code="$(
            curl --show-error --silent \
              -o "$response_file" \
              -w "%{http_code}" \
              -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" || true
          )"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            rm -f "$response_file"
            echo "Cloudflare Workers deploy entitlement preflight passed."
            exit 0
          fi

          echo "Cloudflare Workers deploy entitlement preflight failed before passkey approval validation."
          echo "HTTP status: ${http_code}"
          node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const raw = fs.readFileSync(path, "utf8");
          let body;
          try {
            body = JSON.parse(raw);
          } catch {
            const redacted = raw.replace(/([A-Za-z0-9_-]{24,})/g, "[redacted]");
            console.log(redacted.slice(0, 1000));
            process.exit(0);
          }
          const errors = Array.isArray(body?.errors) ? body.errors : [];
          const messages = errors.map((error) => ({
            code: error?.code ?? null,
            message: String(error?.message ?? "unknown_error").replace(/([A-Za-z0-9_-]{24,})/g, "[redacted]")
          }));
          if (messages.length > 0) {
            console.log(JSON.stringify({ errors: messages }, null, 2));
          } else {
            console.log(JSON.stringify({ success: body?.success ?? null }, null, 2));
          }
          NODE
          rm -f "$response_file"
          echo "Cloudflare account/token is not currently able to access Workers Scripts deploy API. Do not consume another deploy approval until this passes."
          exit 1

      - name: Preflight Cloudflare R2 media bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MEDIA_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_MEDIA_R2_BUCKET_NAME || 'vtdd-media-prod' }}
        shell: bash
        run: |
          response_file="$(mktemp)"
          encoded_bucket="$(
            node -e 'console.log(encodeURIComponent(process.argv[1] || ""))' "$CLOUDFLARE_MEDIA_R2_BUCKET_NAME"
          )"
          http_code="$(
            curl --show-error --silent \
              -o "$response_file" \
              -w "%{http_code}" \
              -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${encoded_bucket}" || true
          )"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            rm -f "$response_file"
            echo "Cloudflare R2 media bucket preflight passed."
            exit 0
          fi

          echo "Cloudflare R2 media bucket preflight failed before passkey approval validation."
          echo "HTTP status: ${http_code}"
          node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const raw = fs.readFileSync(path, "utf8");
          let body;
          try {
            body = JSON.parse(raw);
          } catch {
            const redacted = raw.replace(/([A-Za-z0-9_-]{24,})/g, "[redacted]");
            console.log(redacted.slice(0, 1000));
            process.exit(0);
          }
          const errors = Array.isArray(body?.errors) ? body.errors : [];
          const messages = errors.map((error) => ({
            code: error?.code ?? null,
            message: String(error?.message ?? "unknown_error").replace(/([A-Za-z0-9_-]{24,})/g, "[redacted]")
          }));
          if (messages.length > 0) {
            console.log(JSON.stringify({ errors: messages }, null, 2));
          } else {
            console.log(JSON.stringify({ success: body?.success ?? null }, null, 2));
          }
          NODE
          rm -f "$response_file"
          echo "Cloudflare account/token cannot access the configured R2 media bucket. Enable R2 in the Cloudflare Dashboard, create or select the bucket, and ensure the deploy token can read R2 buckets before requesting another deploy approval."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate real passkey approval grant
        env:
          VTDD_GATEWAY_BEARER_TOKEN: ${{ secrets.VTDD_GATEWAY_BEARER_TOKEN }}
        run: |
          node scripts/validate-deploy-approval-grant.mjs \
            --runtime-url "${{ github.event.inputs.runtime_url }}" \
            --approval-grant-id "${{ github.event.inputs.approval_grant_id }}" \
            --repository "${{ github.repository }}"

      - name: Run tests
        run: npm test

      - name: Generate production Wrangler config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_MEDIA_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_MEDIA_R2_BUCKET_NAME || 'vtdd-media-prod' }}
          VTDD_GITHUB_ACTIONS_REPOSITORY: ${{ github.repository }}
          VTDD_KNOWN_GOOD_COMMIT_SHA: ${{ vars.VTDD_KNOWN_GOOD_COMMIT_SHA }}
          VTDD_DASHBOARD_ALLOWED_EMAILS: ${{ vars.VTDD_DASHBOARD_ALLOWED_EMAILS }}
          VTDD_DASHBOARD_ALLOWED_GITHUB_LOGINS: ${{ vars.VTDD_DASHBOARD_ALLOWED_GITHUB_LOGINS }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
        shell: bash
        run: |
          cp wrangler.toml wrangler.production.generated.toml
          cat >> wrangler.production.generated.toml <<EOF

          [env.production.vars]
          VTDD_GITHUB_ACTIONS_REPOSITORY = "$VTDD_GITHUB_ACTIONS_REPOSITORY"
          EOF
          append_toml_var() {
            local key="$1"
            local value="$2"
            if [ -n "$value" ]; then
              node -e 'const [key, value] = process.argv.slice(1); console.log(`${key} = ${JSON.stringify(value)}`);' "$key" "$value" >> wrangler.production.generated.toml
            fi
          }
          if [ -n "$VTDD_DASHBOARD_ALLOWED_EMAILS" ]; then
            append_toml_var "VTDD_DASHBOARD_ALLOWED_EMAILS" "$VTDD_DASHBOARD_ALLOWED_EMAILS"
          fi
          if [ -n "$VTDD_DASHBOARD_ALLOWED_GITHUB_LOGINS" ]; then
            append_toml_var "VTDD_DASHBOARD_ALLOWED_GITHUB_LOGINS" "$VTDD_DASHBOARD_ALLOWED_GITHUB_LOGINS"
          fi
          if [ -n "$CF_ACCESS_TEAM_DOMAIN" ]; then
            append_toml_var "CF_ACCESS_TEAM_DOMAIN" "$CF_ACCESS_TEAM_DOMAIN"
          fi
          if [ -n "$CF_ACCESS_AUD" ]; then
            append_toml_var "CF_ACCESS_AUD" "$CF_ACCESS_AUD"
          fi
          if [ -n "$VTDD_KNOWN_GOOD_COMMIT_SHA" ]; then
            if [[ ! "$VTDD_KNOWN_GOOD_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "VTDD_KNOWN_GOOD_COMMIT_SHA must be a 40-character commit SHA."
              exit 1
            fi
            cat >> wrangler.production.generated.toml <<EOF
          VTDD_KNOWN_GOOD_COMMIT_SHA = "$VTDD_KNOWN_GOOD_COMMIT_SHA"
          EOF
          fi
          cat >> wrangler.production.generated.toml <<EOF

          [[env.production.d1_databases]]
          binding = "VTDD_MEMORY_D1"
          database_id = "$CLOUDFLARE_D1_DATABASE_ID"

          [[env.production.r2_buckets]]
          binding = "VTDD_MEDIA_R2"
          bucket_name = "$CLOUDFLARE_MEDIA_R2_BUCKET_NAME"
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.83.0"
          command: deploy --config wrangler.production.generated.toml --env production

      - name: Notify dashboard deploy event
        if: always()
        env:
          VTDD_GATEWAY_BEARER_TOKEN: ${{ secrets.VTDD_GATEWAY_BEARER_TOKEN }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          RUNTIME_URL: ${{ github.event.inputs.runtime_url }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$RUNTIME_URL" ]; then
            echo "runtime_url is not set; skipping dashboard deploy event."
            exit 0
          fi
          if [ -z "$VTDD_GATEWAY_BEARER_TOKEN" ]; then
            echo "VTDD_GATEWAY_BEARER_TOKEN is not set; skipping dashboard deploy event."
            exit 0
          fi

          event_body=$(node - <<'NODE'
          const { execFileSync } = require("node:child_process");
          function readGit(args) {
            try {
              return execFileSync("git", args, { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }).trim();
            } catch {
              return "";
            }
          }
          function inferPullNumber(text) {
            const match = String(text || "").match(/\b(?:PR|pull request)\s*#?(\d+)\b/i);
            return match ? Number(match[1]) : null;
          }
          function inferSquashMergePullNumber(subject) {
            const matches = [...String(subject || "").matchAll(/\(#(\d+)\)/g)];
            const last = matches.at(-1);
            return last ? Number(last[1]) : null;
          }
          function inferCommitSummary(subject, body) {
            const normalizedSubject = String(subject || "").trim();
            const bodyLine = String(body || "")
              .split(/\r?\n/)
              .map((line) => line.trim())
              .find(Boolean);
            if (/^Merge pull request #\d+\b/i.test(normalizedSubject) && bodyLine) {
              return bodyLine;
            }
            return normalizedSubject || bodyLine || "";
          }
          async function readAssociatedPullRequest() {
            if (!process.env.GITHUB_TOKEN || !process.env.REPOSITORY || !process.env.DEPLOY_SHA) {
              return null;
            }
            try {
              const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/commits/${process.env.DEPLOY_SHA}/pulls`, {
                signal: AbortSignal.timeout(3000),
                headers: {
                  authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  accept: "application/vnd.github+json",
                  "x-github-api-version": "2022-11-28",
                  "user-agent": "vtdd-dashboard-deploy-associated-pr"
                }
              });
              if (!response.ok) {
                return null;
              }
              const pulls = await response.json();
              return Array.isArray(pulls) ? pulls[0] || null : null;
            } catch {
              return null;
            }
          }
          async function main() {
            const commitSubject = readGit(["log", "-1", "--pretty=%s"]);
            const commitBody = readGit(["log", "-1", "--pretty=%b"]);
            const associatedPull = await readAssociatedPullRequest();
            const pullNumber =
              Number(associatedPull?.number) ||
              inferPullNumber(`${commitSubject}\n${commitBody}`) ||
              inferSquashMergePullNumber(commitSubject);
            const associatedPullTitle = typeof associatedPull?.title === "string" ? associatedPull.title.trim() : "";
            const changeSummary = associatedPullTitle || inferCommitSummary(commitSubject, commitBody);
            const payload = {
              repository: process.env.REPOSITORY,
              workflowName: "deploy-production",
              runId: process.env.RUN_ID,
              runUrl: process.env.RUN_URL,
              status: "completed",
              conclusion: process.env.DEPLOY_JOB_STATUS,
              headSha: process.env.DEPLOY_SHA,
              headBranch: process.env.DEPLOY_BRANCH,
              displayTitle: changeSummary || "deploy-production",
              changeSummary: changeSummary || null,
              pullNumber: pullNumber || null,
              updatedAt: new Date().toISOString()
            };
            process.stdout.write(JSON.stringify(payload));
          }
          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
          )

          event_endpoint="${RUNTIME_URL%/}/v2/events/github-actions"
          event_sent=0
          for attempt in 1 2 3 4 5 6; do
            response_file="$(mktemp)"
            http_code="$(
              curl --show-error --silent \
                -o "$response_file" \
                -w "%{http_code}" \
                -X POST "$event_endpoint" \
                -H "authorization: Bearer ${VTDD_GATEWAY_BEARER_TOKEN}" \
                -H "content-type: application/json" \
                --data "$event_body" || true
            )"
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              event_sent=1
              echo "dashboard deploy event reached Worker with HTTP ${http_code}. Owner-facing notification truth:"
              node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          let body = {};
          try {
            body = JSON.parse(fs.readFileSync(file, "utf8"));
          } catch {
            console.log("- response: unreadable");
            process.exit(0);
          }
          const webPush = body.webPush || {};
          const event = body.event || {};
          console.log(`- eventRunId: ${event.runId || "unknown"}`);
          console.log(`- eventConclusion: ${event.conclusion || "unknown"}`);
          console.log(`- webPushOk: ${webPush.ok === true}`);
          console.log(`- webPushAttempted: ${Number.isFinite(webPush.attempted) ? webPush.attempted : "unknown"}`);
          console.log(`- webPushDelivered: ${Number.isFinite(webPush.delivered) ? webPush.delivered : "unknown"}`);
          console.log(`- webPushCleaned: ${Number.isFinite(webPush.cleaned) ? webPush.cleaned : "unknown"}`);
          if (webPush.error || webPush.reason) {
            console.log(`- webPushError: ${webPush.error || "unknown"}`);
            console.log(`- webPushReason: ${webPush.reason || "unknown"}`);
          }
          NODE
              rm -f "$response_file"
              break
            fi
            echo "dashboard deploy event notification attempt ${attempt} failed with HTTP ${http_code}; retrying after Worker propagation delay."
            sed -E 's/(approval:[a-zA-Z0-9-]+|gh[psuor]_[A-Za-z0-9_]+)/[redacted]/g' "$response_file" || true
            rm -f "$response_file"
            sleep 5
          done

          if [ "$event_sent" -ne 1 ]; then
            echo "dashboard deploy event notification did not reach Worker after retries; deploy remains successful, but dashboard may be stale until the next event."
          fi

      - name: Notify deploy completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_NOTIFICATION_ISSUE_NUMBER: ${{ vars.VTDD_DEPLOY_NOTIFICATION_ISSUE_NUMBER }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
          RUNTIME_URL: ${{ github.event.inputs.runtime_url }}
        shell: bash
        run: |
          if [ -z "$DEPLOY_NOTIFICATION_ISSUE_NUMBER" ]; then
            echo "VTDD_DEPLOY_NOTIFICATION_ISSUE_NUMBER is not set; skipping GitHub mention notification."
            exit 0
          fi
          if [[ ! "$DEPLOY_NOTIFICATION_ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "VTDD_DEPLOY_NOTIFICATION_ISSUE_NUMBER must be a GitHub issue number."
            exit 1
          fi

          body=$(cat <<EOF
          @${REPOSITORY_OWNER} deploy-production finished: ${DEPLOY_JOB_STATUS}.

          - Repository: \`${REPOSITORY}\`
          - Commit: \`${DEPLOY_SHA}\`
          - Actor: \`${DEPLOY_ACTOR}\`
          - Runtime URL: ${RUNTIME_URL}
          - Run: ${RUN_URL}

          This is a GitHub-visible deploy milestone notification. No approval grant id, token, or secret value is included.
          EOF
          )

          gh api \
            "repos/${REPOSITORY}/issues/${DEPLOY_NOTIFICATION_ISSUE_NUMBER}/comments" \
            -f body="$body"
